<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn AutoReply</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="header">
        <div class="logo-area">
            <div class="icon-placeholder">⚡</div>
            <h1>LinkedIn AutoReply</h1>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="section-header">
                <h3>Azure OpenAI Configuration</h3>
            </div>
            <div class="form-group">
                <label for="endpoint">Endpoint URL</label>
                <input type="text" id="endpoint" placeholder="https://resource.openai.azure.com/">
            </div>

            <div class="form-group">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" placeholder="••••••••••••••••">
            </div>

            <div class="form-group">
                <label for="deployment">Deployment Name</label>
                <input type="text" id="deployment" placeholder="e.g., gpt-4">
            </div>
        </div>

        <div class="card">
            <div class="section-header">
                <h3>Personal Info (for placeholders)</h3>
            </div>
            <div class="form-group">
                <label for="p-name">Full Name</label>
                <input type="text" id="p-name" placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label for="p-job">Job Title</label>
                <input type="text" id="p-job" placeholder="e.g. Software Engineer">
            </div>
            <div class="form-group">
                <label for="p-company">Company</label>
                <input type="text" id="p-company" placeholder="e.g. Initech">
            </div>
            <div class="form-group">
                <label for="p-skills">Skills</label>
                <input type="text" id="p-skills" placeholder="e.g. React, Node.js, Azure">
            </div>
            <div class="form-group">
                <label for="p-summary">Profile Summary</label>
                <textarea id="p-summary" rows="3" placeholder="Brief professional summary..."></textarea>
            </div>
        </div>

        <div class="card">
            <div class="section-header">
                <h3>Prompt Profiles</h3>
                <button id="add-profile-btn" class="icon-btn" title="Add Profile">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path
                            d="M8 0a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2H9v6a1 1 0 1 1-2 0V9H1a1 1 0 0 1 0-2h6V1a1 1 0 0 1 1-1z" />
                    </svg>
                </button>
            </div>
            <div id="profiles-list" class="profiles-list">
                <!-- Profiles injected here -->
                <div class="empty-state">No profiles added yet.</div>
            </div>
        </div>

        <!-- Modal/Overlay for Editor -->
        <div id="profile-editor" class="editor-overlay hidden">
            <div class="editor-card">
                <h4 id="editor-title">New Profile</h4>

                <div class="form-group">
                    <label for="profile-name">Profile Name</label>
                    <input type="text" id="profile-name" placeholder="e.g., Polite Refusal">
                </div>

                <div class="form-group">
                    <label for="system-prompt">System Prompt</label>
                    <textarea id="system-prompt" rows="6" placeholder="You are a helpful assistant..."></textarea>
                </div>

                <div class="editor-actions">
                    <button id="cancel-profile-btn" class="btn secondary">Cancel</button>
                    <button id="save-profile-btn" class="btn primary">Save Profile</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button id="save-settings-btn" class="btn primary full-width">Save All Settings</button>
        <div id="status" class="status-message"></div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
